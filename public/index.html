<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9dade">
  <title>Skirmish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world"></canvas>
  <canvas id="game"></canvas>

  <main id="menu" class="menu">
    <div class="menu-card">
      <header class="brand">
        <div class="wordmark">
          <svg class="emblem" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 3 57 17.5v29L32 61 7 46.5v-29z" fill="#1b1d22" stroke="#ffd34d" stroke-width="3" stroke-linejoin="round"/>
            <path d="M32 11 50 21.5v21L32 53 14 42.5v-21z" fill="#2a2e37"/>
            <circle cx="32" cy="32" r="12" fill="none" stroke="#f2f3f5" stroke-width="3.5"/>
            <path d="M32 14v10M32 40v10M14 32h10M40 32h10" stroke="#f2f3f5" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="32" cy="32" r="3.5" fill="#ff5a5f"/>
          </svg>
          <h1 class="logo"><em>S</em>KIRMISH</h1>
        </div>
        <p class="tagline">Top-down arena shooter</p>
      </header>
      <div class="menu-grid">
        <form id="play-form" class="panel play">
          <label class="field">
            <span>Name</span>
            <input id="name" maxlength="16" autocomplete="nickname" placeholder="Unnamed" spellcheck="false">
          </label>
          <div id="loadout-menu" class="loadout"></div>
          <h2>Mode</h2>
          <div id="servers" class="servers"></div>
          <div id="squad" class="squad"></div>
          <div class="play-actions">
            <div id="art-load" class="art-load" role="status" hidden><span class="art-bar"><i id="art-bar"></i></span><span id="art-label"></span></div>
            <p id="menu-status" class="status" role="status"></p>
            <button id="play" type="submit" class="primary">Play</button>
          </div>
        </form>
        <aside class="side">
          <section id="account" class="panel"></section>
          <section id="muted" class="panel" hidden></section>
          <section id="quality" class="panel"></section>
          <section class="panel">
            <h2>Controls</h2>
            <dl id="controls" class="controls"></dl>
          </section>
        </aside>
      </div>
      <footer class="menu-footer"><a href="privacy.html">Privacy</a></footer>
    </div>
  </main>

  <div id="hud" class="hud" hidden>
    <div id="perk-panel" class="perk-panel" hidden></div>
    <div class="chat">
      <ol id="chat-log" class="chat-log"></ol>
      <input id="chat-input" class="chat-input" maxlength="120" placeholder="Say something. Enter sends, Esc cancels." autocomplete="off" hidden>
    </div>
    <div class="touch-buttons">
      <button id="touch-reload" type="button" aria-label="Reload">R</button>
      <button id="touch-ability" type="button" aria-label="Ability">&#9733;</button>
    </div>
    <div id="squad-chip" class="squad-chip" hidden></div>
    <div id="banner" class="banner" hidden></div>
    <div id="report" class="banner report" hidden></div>
    <div id="objective" class="objective" role="status" hidden></div>
    <div id="reconnect" class="reconnect" role="status" hidden></div>
    <div id="death" class="death" hidden>
      <div class="death-card">
        <h2 id="death-title">You were eliminated</h2>
        <p id="death-cause" class="death-cause" hidden></p>
        <p id="death-lost" class="death-lost" hidden></p>
        <p id="death-sub" class="muted"></p>
        <div id="loadout-death" class="loadout"></div>
        <button id="respawn" type="button" class="primary">Respawn</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
