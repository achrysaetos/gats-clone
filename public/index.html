<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121419">
  <title>Skirmish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <main id="menu" class="menu">
    <div class="menu-card">
      <header class="brand">
        <div class="wordmark">
          <svg class="emblem" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M14 4h36l10 10v36L50 60H14L4 50V14z" fill="#15171b" stroke="#ff5a1f" stroke-width="3" stroke-linejoin="miter"/>
            <circle cx="32" cy="32" r="13" fill="none" stroke="#ece6d6" stroke-width="3.5"/>
            <path d="M32 12v11M32 41v11M12 32h11M41 32h11" stroke="#ece6d6" stroke-width="3.5"/>
            <rect x="29" y="29" width="6" height="6" fill="#ff5a1f"/>
          </svg>
          <h1 class="logo"><em>S</em>KIRMISH</h1>
        </div>
        <p class="tagline">Top-down arena shooter</p>
      </header>
      <div class="menu-grid">
        <form id="play-form" class="panel play">
          <label class="field">
            <span>Name <a id="my-profile" class="field-link" href="profile.html">Your service record ›</a></span>
            <input id="name" maxlength="16" autocomplete="nickname" placeholder="Unnamed" spellcheck="false">
          </label>
          <div id="loadout-menu" class="loadout"></div>
          <h2>Server</h2>
          <div id="servers" class="servers"></div>
          <h2>Zombies</h2>
          <div id="squad" class="squad"></div>
          <div class="play-actions">
            <p id="menu-status" class="status" role="status"></p>
            <button id="play" type="submit" class="primary">Deploy</button>
          </div>
        </form>
        <aside class="side">
          <section id="account" class="panel"></section>
          <section id="muted" class="panel" hidden></section>
          <section class="panel">
            <h2>Controls</h2>
            <dl id="controls" class="controls"></dl>
          </section>
        </aside>
      </div>
      <footer class="menu-footer"><a href="profile.html">Look up a player</a> · <a href="privacy.html">Privacy</a></footer>
    </div>
  </main>

  <div id="hud" class="hud" hidden>
    <div id="perk-panel" class="perk-panel" hidden></div>
    <div id="medals" class="medals" aria-live="polite"></div>
    <div class="chat">
      <ol id="chat-log" class="chat-log"></ol>
      <input id="chat-input" class="chat-input" maxlength="120" placeholder="Say something. Enter sends, Esc cancels." autocomplete="off" hidden>
    </div>
    <div class="touch-buttons">
      <button id="touch-reload" type="button" aria-label="Reload"></button>
      <button id="touch-ability" type="button" aria-label="Ability"></button>
    </div>
    <div id="squad-chip" class="squad-chip" hidden></div>
    <div class="rotate-hint" role="status"><span aria-hidden="true">&#8635;</span>Turn your phone sideways to play</div>
    <div id="banner" class="banner" hidden></div>
    <div id="report" class="banner report" hidden></div>
    <div id="objective" class="objective" role="status" hidden></div>
    <div id="reconnect" class="reconnect" role="status" hidden></div>
    <div id="death" class="death" hidden>
      <div class="death-card">
        <h2 id="death-title">You were eliminated</h2>
        <p id="death-cause" class="death-cause" hidden></p>
        <p id="death-lost" class="death-lost" hidden></p>
        <div id="death-recap" class="recap" hidden></div>
        <p id="death-sub" class="muted"></p>
        <div id="loadout-death" class="loadout"></div>
        <button id="respawn" type="button" class="primary">Respawn</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
